{% extends "base.html" %}
{% block titulo %}Alterar senha{% endblock %}
{% block conteudo %}
<div class="cartao-form">
  <h1>Alterar senha</h1>
  {% if user.colaborador.deve_trocar_senha %}
    <p class="aviso">Defina uma nova senha para continuar usando o portal.</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primario">Salvar nova senha</button>
  </form>
</div>
{% endblock %}
